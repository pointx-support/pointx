<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/pointx-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/pointx-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#101319" />
    <script>
      (function() {
        try {
          var s = sessionStorage.getItem('pointx_theme_session');
          var theme = (s === 'light') ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="PointX Esports — Professional Free Fire Tournament Operating System, Point Calculation Engine, OBS Live Broadcast Overlays & 4K Graphics Studio." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="PointX Esports" />
    <meta property="og:description" content="Automated Free Fire point calculation, real-time OBS Studio browser source scoreboards, and 4K overall standings graphics generator." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/pointx-logo.png" />

    <title>PointX Esports — Free Fire Tournament & Point Table Platform</title>
    
    <!-- Google Fonts: Outfit, Syne, Plus Jakarta Sans, Space Grotesk, Sora, Rajdhani, Teko, Bebas Neue -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rajdhani:wght@600;700;800&family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[var(--bg-base)] text-[var(--text-primary)] antialiased selection:bg-[var(--accent-primary)]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
